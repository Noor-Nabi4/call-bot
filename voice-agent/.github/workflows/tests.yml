name: Tests

# Used when this folder is the git root. Monorepo CI lives in
# /.github/workflows/voice-agent-unit-tests.yml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check src tests scripts

      - name: Unit tests
        run: >
          uv run pytest -v
          tests/test_config.py
          tests/test_prompt.py
          tests/test_state.py
          tests/test_lifecycle.py
          tests/test_observability.py
