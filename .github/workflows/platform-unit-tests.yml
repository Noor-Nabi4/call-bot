name: Platform telephony unit tests

on:
  push:
    paths:
      - "platform/**"
      - ".github/workflows/platform-unit-tests.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-unit-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync and test
        run: |
          uv sync
          uv run pytest -v
