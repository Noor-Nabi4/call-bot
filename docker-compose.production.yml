# Production compose for Call & Flow public hosts.
# Terminate TLS in front of these services (nginx via deploy/install.sh):
#   callandflow.com / www.callandflow.com -> web:3000
#   api.callandflow.com                   -> platform:8000
#
# Prefer: sudo bash deploy/install.sh
# Never commit filled .env.production files.

services:
  platform:
    build:
      context: ./platform
    image: voxpilot-platform:prod
    restart: unless-stopped
    env_file:
      - ./platform/.env.production
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      ALLOW_ENV_TENANT_FALLBACK: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: https://callandflow.com
        NEXT_PUBLIC_PLATFORM_API_URL: https://api.callandflow.com
    image: voxpilot-web:prod
    restart: unless-stopped
    env_file:
      - ./web/.env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://callandflow.com
      NEXT_PUBLIC_PLATFORM_API_URL: https://api.callandflow.com
    ports:
      - "3000:3000"
    depends_on:
      platform:
        condition: service_healthy
